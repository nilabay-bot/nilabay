AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: nilabay intake and automation execution tracking (development foundation)
Parameters:
  IntakeToken:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Shared secret used for development-only ingestion; replace with signed provider events before production
Resources:
  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
  IntakeHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref RunsTable
          INTAKE_TOKEN: !Ref IntakeToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable
      Events:
        Intake:
          Type: Api
          Properties:
            Path: /intake
            Method: post
            Auth:
              ApiKeyRequired: true
Outputs:
  IntakeApi:
    Description: Development intake endpoint, requires an API key plus bearer token
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/intake'
  TableName:
    Value: !Ref RunsTable
